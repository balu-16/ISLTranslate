[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-slt"
version = "0.1.0"
description = "Auditable continuous Indian Sign Language to English research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7",
  "packaging>=24,<27", "requests>=2.32,<3", "urllib3>=2,<3",
  "transformers==4.57.1", "sentencepiece>=0.2,<0.3", "safetensors>=0.4,<1",
  "huggingface-hub>=0.34,<1", "pose-format>=0.10,<1",
  "sacrebleu>=2.5,<3", "rouge-score==0.1.2", "nltk>=3.9,<4",
]

[project.optional-dependencies]
cpu = ["torch==2.11.0", "torchvision==0.26.0"]
rgb = ["opencv-python-headless>=4.10,<5"]
lexical = ["spacy>=3.8,<4"]
semantic = ["bert-score>=0.3.13,<0.4"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6.29,<8"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: offline synthetic CLI integration with locally initialized tiny models"]

[project.scripts]
isl-slt = "isl_slt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# GPU environments retain their host torch build (see managed setup).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
