# ISL-MEGA v2 Research Architecture (all 6 Q1-proposed mechanisms enabled).
# These settings are architectural hypotheses requiring empirical validation and
# component ablations against configs/ablation_v1_baseline.yaml.
vision:
  backend: timm
  timm_model_name: vit_large_patch14_dinov2.lvd142m
  pretrained: true
  image_size: 518
  crop_size: 518
  patch_size: 14
  dim: 1024
  depth: 24
  heads: 16
  mlp_ratio: 4.0
  dropout: 0.1
  separate_hand_face_body: true
  freeze_backbone: false
pose:
  num_landmarks: 66
  node_dim: 11
  hidden_dim: 512
  layers: 3
  heads: 8
  dropout: 0.1
  min_confidence: 0.0
  max_interpolation_gap_seconds: 0.20
  normalize_by_shoulder_span: true
  share_hand_encoder: true
  cross_articulator_graph: true
  cross_articulator_layers: 1
motion:
  hidden_dim: 512
  temporal_kernel: 7
  dropout: 0.1
fusion:
  dim: 1024
  num_heads: 16
  layers: 3
  quality_dim: 5
  dropout: 0.1
  continuous_time_lag: true
  lag_window_seconds: 0.20
  lag_radius_frames: 4
  reliability_uncertainty_gate: true
fingerspelling:
  enabled: true
  hidden_dim: 512
  layers: 3
  dropout: 0.1
  span_routing: true
temporal:
  dim: 1024
  local_kernels: [3, 5, 9, 15]
  local_dilations: [1, 1, 2, 4]
  global_layers: 12
  heads: 16
  ffn_dim: 4096
  dropout: 0.1
  relative_time_buckets: 64
  max_elapsed_seconds: 30.0
  coarse_stride: 2
  detail_window: 7
  planner_queries: 32
  planner_layers: 3
  adaptive_consolidation: true
  diverse_ordered_planning: true
  dynamic_plan_routing: true
  min_plan_queries: 4
  plan_order_margin: 0.0
decoder:
  model_name: google/flan-t5-xl
  local_files_only: false
  max_target_tokens: 256
  freeze_decoder: false
  use_semantic_ot: true
  ot_epsilon: 0.08
  ot_iterations: 30
  plan_semantic_ot: true
  plan_ot_alpha: 0.5
  use_counterfactual_grounding: true
  counterfactual_margin: 0.5
  counterfactual_kl_margin: 0.2
  counterfactual_mode: batch_swap_or_zero
data:
  train_manifest: data/manifests/train.jsonl
  valid_manifest: data/manifests/valid.jsonl
  test_manifest: data/manifests/test.jsonl
  image_size: 518
  crop_size: 518
  num_workers: 8
  pin_memory: true
  max_target_tokens: 256
  strict_source_disjoint: true
  require_signer_disjoint: true
train:
  epochs: 40
  batch_size: 2
  visual_lr: 0.0001
  decoder_lr: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
  amp_dtype: bf16
  ctc_weight: 0.10
  fs_spot_weight: 0.05
  ot_weight: 0.05
  cross_modal_weight: 0.05
  cross_modal_temperature: 0.07
  plan_diversity_weight: 0.05
  plan_order_weight: 0.02
  fusion_entropy_weight: 0.02
  fusion_calibration_weight: 0.05
  counterfactual_weight: 0.05
  label_smoothing: 0.0
  seed: 2026
  output_dir: runs/isl-mega-v2-xl
  log_every: 20
  save_every_epochs: 1
