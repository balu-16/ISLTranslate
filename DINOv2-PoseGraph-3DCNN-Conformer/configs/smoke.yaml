vision:
  backend: native
  pretrained: false
  image_size: 64
  crop_size: 32
  patch_size: 8
  dim: 32
  depth: 1
  heads: 4
  mlp_ratio: 2.0
  dropout: 0.0
  separate_hand_face_body: true
pose:
  num_landmarks: 66
  node_dim: 11
  hidden_dim: 32
  layers: 1
  heads: 4
  dropout: 0.0
motion:
  hidden_dim: 32
  temporal_kernel: 3
  dropout: 0.0
fusion:
  dim: 64
  num_heads: 4
  layers: 1
  quality_dim: 5
  dropout: 0.0
fingerspelling:
  enabled: true
  hidden_dim: 32
  layers: 1
  dropout: 0.0
temporal:
  dim: 64
  local_kernels: [3, 5]
  local_dilations: [1, 2]
  global_layers: 2
  heads: 4
  ffn_dim: 128
  dropout: 0.0
  relative_time_buckets: 16
  max_elapsed_seconds: 10.0
  coarse_stride: 2
  detail_window: 3
  planner_queries: 4
  planner_layers: 1
decoder:
  model_name: google/flan-t5-small
  local_files_only: true
  max_target_tokens: 64
  freeze_decoder: false
  use_semantic_ot: true
  ot_epsilon: 0.08
  ot_iterations: 8
data:
  train_manifest: synthetic_data/train.jsonl
  valid_manifest: synthetic_data/valid.jsonl
  test_manifest: synthetic_data/test.jsonl
  image_size: 64
  crop_size: 32
  num_workers: 0
  pin_memory: false
  max_target_tokens: 64
  strict_source_disjoint: true
  require_signer_disjoint: true
train:
  epochs: 1
  batch_size: 2
  visual_lr: 0.0002
  decoder_lr: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip_norm: 1.0
  amp_dtype: none
  ctc_weight: 0.1
  ot_weight: 0.05
  label_smoothing: 0.0
  seed: 7
  output_dir: runs/smoke
  log_every: 1
  save_every_epochs: 1
